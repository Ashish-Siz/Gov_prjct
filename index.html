<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sarkari Jobs – All India, One Place</title>
<style>
:root{
  --bg:#f6f7f9; --card:#fff; --text:#16181d; --muted:#667085; --line:#e4e7ec;
  --brand:#1a56db; --brand-t:#fff; --ok:#067647; --ok-bg:#dcfae6; --warn:#b54708; --warn-bg:#fef0c7;
  --bad:#b42318; --bad-bg:#fee4e2; --chip:#eef2ff;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1115; --card:#181b21; --text:#eceef2; --muted:#98a2b3; --line:#2a2f38;
  --brand:#6b9bff; --brand-t:#0b1020; --ok:#75e0a7; --ok-bg:#12372a; --warn:#fec84b; --warn-bg:#3a2a06;
  --bad:#fda29b; --bad-bg:#3b1512; --chip:#1d2540;}}
:root[data-theme="dark"]{
  --bg:#0f1115; --card:#181b21; --text:#eceef2; --muted:#98a2b3; --line:#2a2f38;
  --brand:#6b9bff; --brand-t:#0b1020; --ok:#75e0a7; --ok-bg:#12372a; --warn:#fec84b; --warn-bg:#3a2a06;
  --bad:#fda29b; --bad-bg:#3b1512; --chip:#1d2540;}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
[hidden]{display:none!important}

header{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);border-bottom:1px solid var(--line);z-index:20;padding:10px 14px}
.top{display:flex;gap:8px;align-items:center;flex-wrap:wrap;max-width:1200px;margin:0 auto}
h1{font-size:18px;margin:0 12px 0 0;white-space:nowrap}
input[type=search],select{padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--text);font-size:15px;min-width:0}
#q{flex:1 1 220px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;max-width:1200px;margin:8px auto 0}
.tab{border:1px solid var(--line);background:var(--card);color:var(--text);padding:7px 12px;border-radius:99px;font-size:14px;cursor:pointer}
.tab.on{background:var(--brand);color:var(--brand-t);border-color:var(--brand);font-weight:600}
.tab small{opacity:.75;margin-left:4px}
#fbtn{display:none}

.wrap{display:grid;grid-template-columns:270px 1fr;gap:16px;max-width:1200px;margin:0 auto;padding:12px 14px 40px}
aside{align-self:start;position:sticky;top:112px;max-height:calc(100vh - 128px);overflow:auto;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:6px 12px}
.facet{border-bottom:1px solid var(--line);padding:8px 0}
.facet:last-child{border-bottom:0}
.facet h3{font-size:13px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin:0 0 6px;display:flex;justify-content:space-between}
.opt{display:flex;gap:8px;align-items:center;padding:3px 0;font-size:14px;cursor:pointer}
.opt span.n{margin-left:auto;color:var(--muted);font-size:12px}
.opt input{margin:0}
.more-link{background:none;border:0;color:var(--brand);padding:4px 0;font-size:13px;cursor:pointer}
.fh{display:none;justify-content:space-between;align-items:center;padding:8px 0;font-weight:600}

.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.chip{background:var(--chip);color:var(--text);border:1px solid var(--line);border-radius:99px;padding:3px 10px;font-size:13px;cursor:pointer}
.chip.clear{background:transparent;color:var(--brand)}
.bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;gap:8px;flex-wrap:wrap}
.meta{color:var(--muted);font-size:13px}

.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px}
.title{font-weight:600;margin:6px 0 4px}
.badges{display:flex;gap:6px;flex-wrap:wrap}
.b{font-size:12px;padding:2px 8px;border-radius:99px;border:1px solid var(--line);color:var(--muted)}
.b.new,.b.open{background:var(--ok-bg);color:var(--ok);border-color:transparent}
.b.soon,.b.star{background:var(--warn-bg);color:var(--warn);border-color:transparent}
.b.closed{background:var(--bad-bg);color:var(--bad);border-color:transparent}
.last{font-size:13px;color:var(--muted);margin:2px 0 8px}
.btns{display:flex;gap:8px;flex-wrap:wrap}
a.btn{display:inline-block;padding:8px 12px;border-radius:8px;border:1px solid var(--line);color:var(--text);text-decoration:none;font-size:14px}
a.btn.primary{background:var(--brand);color:var(--brand-t);border-color:var(--brand);font-weight:600}
.empty{text-align:center;color:var(--muted);padding:40px 10px}
button.more{display:block;margin:14px auto;padding:10px 18px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--text);font-size:15px;cursor:pointer}
.demo{background:var(--warn-bg);color:var(--warn);text-align:center;padding:6px;font-size:13px;font-weight:600}

@media (max-width:820px){
  .wrap{grid-template-columns:1fr}
  #fbtn{display:inline-block}
  aside{position:fixed;inset:0;top:0;max-height:none;border-radius:0;z-index:50;transform:translateX(-100%);transition:transform .2s;padding:10px 14px calc(env(safe-area-inset-bottom,0px) + 70px)}
  aside.open{transform:none}
  .fh{display:flex}
  .applybar{position:fixed;left:0;right:0;bottom:0;padding:10px 14px calc(env(safe-area-inset-bottom,0px) + 10px);background:var(--bg);border-top:1px solid var(--line)}
  .applybar button{width:100%;padding:11px;border-radius:8px;border:0;background:var(--brand);color:var(--brand-t);font-size:16px;font-weight:600}
}
@media (min-width:821px){.applybar{display:none}}
</style>
</head>
<body>
<div class="demo" id="demo" hidden>DEMO DATA – sample entries to preview filters. Not real jobs.</div>
<header>
  <div class="top">
    <h1>Sarkari Jobs – All India</h1>
    <input id="q" type="search" placeholder="Search: railway, ISRO, UKPSC, engineer…">
    <select id="sort">
      <option value="new">Newest first</option>
      <option value="close">Closing soon</option>
    </select>
    <button class="tab" id="fbtn">Filters <small id="fcount"></small></button>
  </div>
  <div class="tabs" id="tabs"></div>
</header>

<div class="wrap">
  <aside id="side">
    <div class="fh"><span>Filters</span><button class="tab" id="fclose">Close</button></div>
    <div id="facets"></div>
    <div class="applybar"><button id="fapply">Show results</button></div>
  </aside>
  <section>
    <div class="bar"><div class="meta" id="meta">Loading…</div></div>
    <div class="chips" id="chips"></div>
    <div id="list"></div>
    <button class="more" id="more" hidden>Show more</button>
  </section>
</div>

<script>
const PAGE = 40, DAY = 864e5;
const $ = id => document.getElementById(id);
const el = (t,c,x)=>{const e=document.createElement(t); if(c) e.className=c; if(x!==undefined) e.textContent=x; return e;};
const safeUrl = u => (typeof u==="string" && /^https?:\/\//i.test(u)) ? u : null;

let ALL=[], META={}, shown=PAGE, tab="open", loadError=false;
const SEL = {sector:new Set(), org:new Set(), qual:new Set(), state:new Set(), posted:new Set(), extra:new Set()};
const EXPAND = {org:false, state:false, qual:false, sector:true};

const today0 = (()=>{const d=new Date(); d.setHours(0,0,0,0); return d.getTime();})();
function daysLeft(j){ if(!j.deadline) return null; const d=new Date(j.deadline+"T00:00:00").getTime(); return Math.round((d-today0)/DAY); }
function status(j){ const n=daysLeft(j); if(n===null) return "unknown"; if(n<0) return "closed"; if(n<=7) return "soon"; return "open"; }
function ageDays(j){ return (Date.now()-new Date(j.first_seen).getTime())/DAY; }

const FACETS = [
  {key:"sector", label:"Sector",           get:j=>[j.sector]},
  {key:"org",    label:"Organisation",     get:j=>[j.source], limit:8},
  {key:"qual",   label:"Qualification",    get:j=>(j.quals&&j.quals.length)?j.quals:["Not specified"], limit:6},
  {key:"state",  label:"State / Region",   get:j=>[j.state||"All India"], limit:8},
  {key:"posted", label:"Posted",           get:j=>{const a=ageDays(j); return [a<=1?"Last 24 hours":a<=3?"Last 3 days":a<=7?"Last 7 days":"Older"];}, order:["Last 24 hours","Last 3 days","Last 7 days","Older"]},
  {key:"extra",  label:"Must have",        get:j=>{const r=[]; if(j.apply) r.push("Apply link"); if(j.notification) r.push("Notification PDF"); if(j.ece) r.push("⭐ ECE fit"); if(j.deadline) r.push("Last date known"); return r;}, and:true},
];

function tabMatch(j){
  const s=status(j);
  if(tab==="open") return s!=="closed";
  if(tab==="soon") return s==="soon";
  if(tab==="closed") return s==="closed";
  return true;
}
function facetMatch(j,f){
  const sel=SEL[f.key]; if(!sel.size) return true;
  const vals=f.get(j);
  return f.and ? [...sel].every(v=>vals.includes(v)) : vals.some(v=>sel.has(v));
}
function matches(j, skip, ignoreTab){
  if(!ignoreTab && !tabMatch(j)) return false;
  const q=$("q").value.trim().toLowerCase();
  if(q && !(j.title+" "+j.source+" "+j.sector+" "+(j.state||"")).toLowerCase().includes(q)) return false;
  return FACETS.every(f=>f.key===skip || facetMatch(j,f));
}

function renderTabs(){
  const base = ALL.filter(j=>matches(j,null,true));
  const c = {open:0,soon:0,closed:0,all:base.length};
  base.forEach(j=>{const s=status(j); if(s!=="closed") c.open++; if(s==="soon") c.soon++; if(s==="closed") c.closed++;});
  const t=$("tabs"); t.replaceChildren();
  [["open","Open jobs"],["soon","Closing in 7 days"],["all","All"],["closed","Closed"]].forEach(([k,l])=>{
    const b=el("button","tab"+(tab===k?" on":""),l); b.append(el("small","",c[k]));
    b.onclick=()=>{tab=k;shown=PAGE;render();}; t.append(b);
  });
}

function renderFacets(){
  const box=$("facets"); box.replaceChildren();
  FACETS.forEach(f=>{
    const rows=ALL.filter(j=>tabMatch(j) && matches(j,f.key));
    const counts=new Map();
    rows.forEach(j=>new Set(f.get(j)).forEach(v=>counts.set(v,(counts.get(v)||0)+1)));
    SEL[f.key].forEach(v=>{ if(!counts.has(v)) counts.set(v,0); });
    let vals=[...counts.entries()];
    if(f.order) vals.sort((a,b)=>f.order.indexOf(a[0])-f.order.indexOf(b[0]));
    else vals.sort((a,b)=>b[1]-a[1]||a[0].localeCompare(b[0]));
    if(!vals.length) return;
    const wrap=el("div","facet"), h=el("h3","",f.label);
    if(SEL[f.key].size){ const c=el("button","more-link","clear"); c.onclick=()=>{SEL[f.key].clear();shown=PAGE;render();}; h.append(c); }
    wrap.append(h);
    const lim=f.limit||99, open=EXPAND[f.key];
    vals.forEach(([v,n],i)=>{
      if(!open && i>=lim && !SEL[f.key].has(v)) return;
      const lab=el("label","opt"), cb=document.createElement("input");
      cb.type="checkbox"; cb.checked=SEL[f.key].has(v);
      cb.onchange=()=>{ cb.checked?SEL[f.key].add(v):SEL[f.key].delete(v); shown=PAGE; render(); };
      lab.append(cb, el("span","",v), el("span","n",n)); wrap.append(lab);
    });
    if(vals.length>lim){ const m=el("button","more-link",open?"Show less":"Show all ("+vals.length+")"); m.onclick=()=>{EXPAND[f.key]=!EXPAND[f.key];renderFacets();}; wrap.append(m); }
    box.append(wrap);
  });
}

function renderChips(){
  const c=$("chips"); c.replaceChildren(); let any=false;
  FACETS.forEach(f=>SEL[f.key].forEach(v=>{ any=true;
    const b=el("button","chip",v+"  ✕"); b.onclick=()=>{SEL[f.key].delete(v);shown=PAGE;render();}; c.append(b); }));
  if(any){ const x=el("button","chip clear","Clear all"); x.onclick=()=>{Object.values(SEL).forEach(s=>s.clear());shown=PAGE;render();}; c.append(x); }
  const n=Object.values(SEL).reduce((a,s)=>a+s.size,0);
  $("fcount").textContent=n?"("+n+")":"";
}

function btn(label,url,primary){ const u=safeUrl(url); if(!u) return null;
  const a=el("a","btn"+(primary?" primary":""),label); a.href=u; a.target="_blank"; a.rel="noopener noreferrer"; return a; }

function renderList(){
  const rows=ALL.filter(j=>matches(j,null));
  if($("sort").value==="close")
    rows.sort((a,b)=>(a.deadline||"9999").localeCompare(b.deadline||"9999"));
  else rows.sort((a,b)=>b.first_seen.localeCompare(a.first_seen));

  const list=$("list"); list.replaceChildren();
  if(!rows.length) list.append(el("div","empty", loadError ? "No data yet. Run the bot once to create jobs_public.json (or open this page with ?demo=1 to preview)." : "No jobs match these filters. Try clearing some."));
  rows.slice(0,shown).forEach(j=>{
    const c=el("div","card"), bd=el("div","badges"), s=status(j), n=daysLeft(j);
    if(ageDays(j)<=3) bd.append(el("span","b new","NEW"));
    if(s==="open") bd.append(el("span","b open","Open"));
    if(s==="soon") bd.append(el("span","b soon", n===0?"Closes today":"Closes in "+n+" day"+(n>1?"s":"")));
    if(s==="closed") bd.append(el("span","b closed","Closed"));
    if(j.ece) bd.append(el("span","b star","⭐ ECE fit"));
    bd.append(el("span","b",j.sector), el("span","b",j.source), el("span","b",j.state||"All India"));
    (j.quals||[]).slice(0,3).forEach(q=>bd.append(el("span","b",q)));
    c.append(bd, el("div","title",j.title));
    c.append(el("div","last", j.last_date ? "Last date: "+j.last_date : "Last date not found – check the notification"));
    const b=el("div","btns");
    [btn("Apply",j.apply,true), btn("Notification",j.notification,!j.apply), btn("Job page",j.link,!j.apply&&!j.notification), btn("Official site",j.website)]
      .filter(Boolean).forEach(x=>b.append(x));
    c.append(b); list.append(c);
  });
  $("more").hidden = rows.length<=shown;
  const upd = META.updated ? " · updated "+new Date(META.updated).toLocaleString("en-IN") : "";
  $("meta").textContent = rows.length+" jobs"+upd;
}

function render(){ renderTabs(); renderFacets(); renderChips(); renderList(); }

async function init(){
  const demo = new URLSearchParams(location.search).has("demo");
  try{
    const r = await fetch((demo?"jobs_demo.json":"jobs_public.json")+"?"+Date.now());
    if(!r.ok) throw new Error(r.status);
    const d = await r.json(); ALL=d.jobs||[]; META=d;
    $("demo").hidden=!demo;
  }catch(e){ loadError=true; }
  render();
}
$("q").addEventListener("input",()=>{shown=PAGE;render();});
$("sort").addEventListener("change",render);
$("more").onclick=()=>{shown+=PAGE;renderList();};
$("fbtn").onclick=()=>$("side").classList.add("open");
$("fclose").onclick=$("fapply").onclick=()=>$("side").classList.remove("open");
init();
</script>
</body>
</html>
