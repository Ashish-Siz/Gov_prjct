<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sarkari Jobs – Dynamic Dashboard</title>
    <style>
        /* =========================================
           1. BASE STYLES & VARIABLES
           ========================================= */
        :root {
            --bg-main: #0f1115;
            --bg-sidebar: #16181d;
            --bg-card: #1a1d24;
            --bg-input: #1e2128;
            --border-color: #2a2d35;
            --text-main: #e0e0e0;
            --text-muted: #888888;
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --tag-bg: #2a2d35;
            --tag-new-bg: #064e3b;
            --tag-new-text: #34d399;
            --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--font-family);
            background-color: var(--bg-main);
            color: var(--text-main);
            height: 100vh;
            overflow: hidden; /* Prevents whole page scroll */
        }

        /* =========================================
           2. STICKY LAYOUT STRUCTURE
           ========================================= */
        .app-container {
            display: flex;
            height: 100vh;
            width: 100vw;
        }

        /* Sidebar (Fixed) */
        .sidebar {
            width: 260px;
            background-color: var(--bg-sidebar);
            border-right: 1px solid var(--border-color);
            padding: 20px;
            overflow-y: auto;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .sidebar h3 {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-muted);
            margin-bottom: 5px;
        }

        .sector-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 14px;
            color: var(--text-muted);
            cursor: pointer;
            padding: 6px 0;
            transition: color 0.2s;
        }

        .sector-item:hover {
            color: var(--text-main);
        }

        .sector-item label {
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            width: 100%;
        }

        .sector-item input[type="checkbox"] {
            accent-color: var(--primary);
            width: 16px;
            height: 16px;
            cursor: pointer;
        }

        .sector-count {
            font-size: 12px;
            background: var(--bg-input);
            padding: 2px 8px;
            border-radius: 12px;
        }

        /* Main Content Area */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden; /* Contains the scrollable list */
        }

        /* Header (Sticky) */
        .top-header {
            padding: 20px 25px;
            background-color: var(--bg-main);
            border-bottom: 1px solid var(--border-color);
            flex-shrink: 0; /* Prevents header from shrinking */
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .search-row {
            display: flex;
            gap: 15px;
        }

        .search-input {
            flex: 1;
            padding: 12px 16px;
            background-color: var(--bg-input);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            border-radius: 8px;
            font-size: 15px;
            outline: none;
            transition: border-color 0.2s;
        }

        .search-input:focus {
            border-color: var(--primary);
        }

        .tabs {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding-bottom: 5px;
        }

        .tab {
            padding: 8px 16px;
            background-color: var(--bg-input);
            border-radius: 20px;
            font-size: 14px;
            cursor: pointer;
            white-space: nowrap;
            border: 1px solid transparent;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .tab:hover {
            background-color: var(--border-color);
        }

        .tab.active {
            background-color: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        .tab span {
            background: rgba(0,0,0,0.3);
            padding: 2px 8px;
            border-radius: 10px;
            font-size: 12px;
        }

        /* Job List (Scrollable) */
        .job-list {
            flex: 1;
            overflow-y: auto;
            padding: 20px 25px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        /* =========================================
           3. JOB CARD STYLES
           ========================================= */
        .job-card {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 18px;
            transition: transform 0.2s, border-color 0.2s;
        }

        .job-card:hover {
            border-color: #444;
        }

        .tags {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 12px;
        }

        .tags span {
            font-size: 11px;
            background-color: var(--tag-bg);
            color: var(--text-muted);
            padding: 4px 10px;
            border-radius: 4px;
            font-weight: 500;
        }

        .tags span.new {
            background-color: var(--tag-new-bg);
            color: var(--tag-new-text);
            font-weight: bold;
        }

        .job-title {
            font-size: 18px;
            font-weight: 600;
            color: #ffffff;
            margin-bottom: 8px;
        }

        .job-meta {
            font-size: 13px;
            color: var(--text-muted);
            margin-bottom: 15px;
        }

        .actions {
            display: flex;
            gap: 10px;
        }

        .btn {
            padding: 8px 16px;
            border-radius: 6px;
            text-decoration: none;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            border: 1px solid transparent;
            transition: background-color 0.2s;
        }

        .btn-primary {
            background-color: var(--primary);
            color: white;
        }

        .btn-primary:hover {
            background-color: var(--primary-hover);
        }

        .btn-outline {
            border-color: var(--border-color);
            color: var(--text-main);
            background: transparent;
        }

        .btn-outline:hover {
            background-color: var(--bg-input);
        }

        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 40px;
            color: var(--text-muted);
        }

        /* Mobile Responsiveness */
        @media (max-width: 768px) {
            .app-container {
                flex-direction: column;
            }
            .sidebar {
                width: 100%;
                height: 200px; /* Limit height on mobile */
                border-right: none;
                border-bottom: 1px solid var(--border-color);
            }
            .top-header {
                padding: 15px;
            }
            .job-list {
                padding: 15px;
            }
        }
    </style>
</head>
<body>

<div class="app-container">
    <!-- ================= SIDEBAR ================= -->
    <aside class="sidebar">
        <h3>Sector</h3>
        <div id="sector-filters">
            <!-- Sector checkboxes will be injected here by JS -->
        </div>
    </aside>

    <!-- ================= MAIN CONTENT ================= -->
    <main class="main-content">
        
        <!-- STICKY HEADER -->
        <header class="top-header">
            <div class="search-row">
                <input type="text" id="searchInput" class="search-input" placeholder="Search: railway, ISRO, engineer...">
            </div>
            <div class="tabs">
                <div class="tab active" data-filter="open">Open jobs <span id="count-open">0</span></div>
                <div class="tab" data-filter="closing">Closing in 7 days <span id="count-closing">0</span></div>
                <div class="tab" data-filter="saved">Saved <span id="count-saved">0</span></div>
                <div class="tab" data-filter="all">All <span id="count-all">0</span></div>
            </div>
        </header>

        <!-- SCROLLABLE JOB LIST -->
        <section class="job-list" id="job-list-container">
            <!-- Job cards will be injected here by JS -->
            <div class="empty-state">Loading jobs...</div>
        </section>
        
    </main>
</div>

<script>
    /* =========================================
       1. DATA SOURCE (Replace with fetch('jobs.json') later)
       ========================================= */
    const mockJobs = [
        { id: 1, title: "Recruitment Agencies/International Employer", sector: "Banking", tags: ["NEW", "Central", "NCS Portal"], lastDate: "2026-10-15", isNew: true, isSaved: false },
        { id: 2, title: "List of Model Career Center", sector: "Central", tags: ["NEW", "Central"], lastDate: "2026-10-20", isNew: true, isSaved: false },
        { id: 3, title: "Career Schemes", sector: "Teaching", tags: ["Central"], lastDate: "2026-12-01", isNew: false, isSaved: false },
        { id: 4, title: "Railway Engineer Recruitment", sector: "PSU-Tech", tags: ["Railway", "Engineering"], lastDate: "2026-10-05", isNew: false, isSaved: true },
        { id: 5, title: "ISRO Scientist", sector: "Science-Survey", tags: ["ISRO", "Science"], lastDate: "2026-11-11", isNew: true, isSaved: false },
        { id: 6, title: "Bank Clerk Position", sector: "Banking", tags: ["Bank", "Clerk"], lastDate: "2026-10-08", isNew: false, isSaved: false },
        { id: 7, title: "State Police Constable", sector: "Police-Intel", tags: ["Police", "State"], lastDate: "2026-10-12", isNew: true, isSaved: false },
        { id: 8, title: "Defence Academy", sector: "Defence", tags: ["Defence", "Army"], lastDate: "2026-11-01", isNew: false, isSaved: false }
    ];

    /* =========================================
       2. STATE VARIABLES
       ========================================= */
    let allJobs = [];
    let activeSector = 'All';
    let activeTab = 'open';
    let searchTerm = '';

    /* =========================================
       3. INITIALIZATION
       ========================================= */
    document.addEventListener('DOMContentLoaded', () => {
        // Simulate an API fetch delay
        setTimeout(() => {
            allJobs = mockJobs;
            updateCounts();
            renderSectors();
            applyFilters(); // Initial render
        }, 300);

        // Attach Event Listeners
        document.getElementById('searchInput').addEventListener('input', (e) => {
            searchTerm = e.target.value.toLowerCase();
            applyFilters();
        });

        document.querySelectorAll('.tab').forEach(tab => {
            tab.addEventListener('click', (e) => {
                // Update active class
                document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
                e.currentTarget.classList.add('active');
                
                // Update state and filter
                activeTab = e.currentTarget.getAttribute('data-filter');
                applyFilters();
            });
        });
    });

    /* =========================================
       4. RENDER FUNCTIONS
       ========================================= */
    
    // Renders the Sector sidebar dynamically
    function renderSectors() {
        const sectorContainer = document.getElementById('sector-filters');
        const sectors = ['All', ...new Set(allJobs.map(j => j.sector))];
        
        sectorContainer.innerHTML = sectors.map(sector => {
            const count = sector === 'All' ? allJobs.length : allJobs.filter(j => j.sector === sector).length;
            const isChecked = sector === activeSector ? 'checked' : '';
            
            return `
                <div class="sector-item">
                    <label onclick="filterBySector('${sector}')">
                        <input type="checkbox" ${isChecked} readonly> 
                        ${sector}
                    </label>
                    <span class="sector-count">${count}</span>
                </div>
            `;
        }).join('');
    }

    // Renders the Job Cards
    function renderJobs(jobs) {
        const container = document.getElementById('job-list-container');
        
        if(jobs.length === 0) {
            container.innerHTML = '<div class="empty-state">No jobs found matching your criteria.</div>';
            return;
        }

        container.innerHTML = jobs.map(job => `
            <div class="job-card">
                <div class="tags">
                    ${job.isNew ? '<span class="new">NEW</span>' : ''}
                    ${job.tags.map(t => `<span>${t}</span>`).join('')}
                </div>
                <div class="job-title">${job.title}</div>
                <div class="job-meta">Last date: ${job.lastDate}</div>
                <div class="actions">
                    <a href="#" class="btn btn-primary">Job page</a>
                    <a href="#" class="btn btn-outline">Official site</a>
                </div>
            </div>
        `).join('');
    }

    /* =========================================
       5. FILTER LOGIC
       ========================================= */
    
    window.filterBySector = (sector) => {
        activeSector = sector;
        renderSectors(); // Re-render to update checkbox state
        applyFilters();
    };

    function applyFilters() {
        let filtered = [...allJobs];

        // 1. Apply Tab Filter
        if (activeTab === 'open') {
            // Assuming all jobs in mock data are open for now
            filtered = filtered.filter(j => new Date(j.lastDate) >= new Date());
        } else if (activeTab === 'closing') {
            const nextWeek = new Date();
            nextWeek.setDate(nextWeek.getDate() + 7);
            filtered = filtered.filter(j => {
                const lastDate = new Date(j.lastDate);
                return lastDate >= new Date() && lastDate <= nextWeek;
            });
        } else if (activeTab === 'saved') {
            filtered = filtered.filter(j => j.isSaved === true);
        }

        // 2. Apply Sector Filter
        if (activeSector !== 'All') {
            filtered = filtered.filter(j => j.sector === activeSector);
        }

        // 3. Apply Search Term
        if (searchTerm) {
            filtered = filtered.filter(j => 
                j.title.toLowerCase().includes(searchTerm) || 
                j.tags.some(t => t.toLowerCase().includes(searchTerm)) ||
                j.sector.toLowerCase().includes(searchTerm)
            );
        }

        renderJobs(filtered);
    }

    // Calculates the numbers for the top tabs
    function updateCounts() {
        document.getElementById('count-all').innerText = allJobs.length;
        
        const openJobs = allJobs.filter(j => new Date(j.lastDate) >= new Date());
        document.getElementById('count-open').innerText = openJobs.length;

        const nextWeek = new Date();
        nextWeek.setDate(nextWeek.getDate() + 7);
        const closingSoon = allJobs.filter(j => {
            const lastDate = new Date(j.lastDate);
            return lastDate >= new Date() && lastDate <= nextWeek;
        });
        document.getElementById('count-closing').innerText = closingSoon.length;

        const savedJobs = allJobs.filter(j => j.isSaved);
        document.getElementById('count-saved').innerText = savedJobs.length;
    }
</script>
</body>
</html>
